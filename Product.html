<!DOCTYPE html>
<html>
    <head>
        <title>Product details</title>
    </head>
<body>
   <Center> <h3><b>Enter a product information</b></h3></Center>
    <form method="POST" enctype="multipart/form-data">
       <table border="1">
        <div>
        <tr>
            <td>Enter a Product name</td>
        <td><input type="text"
         name="My product name"
         id="text-input"
         placeholder="Ex:Badam"
         max="90">
         </div></td></tr>
<div>
        <tr>
        <td>Enter a brand</td>
        <td><input type="text"
         name="My brand"
         id="brand"
         max="90">
         </div></td></tr>
<div>
      <tr>
        <td>Enter a customer support email</td>
         <td><input type="email"
         name="My product mail"
         id="email"
         max="90">
         </div></td></tr>
<div>
        <tr>
        <td>Enter a size</td>
        <td><input type="number "
         name="My size"
         id="size"
         max="90">
         kg
         </div></td></tr>
<div>
    <div>
        <tr>
        <td>Enter a prize</td>
        <td><input type="number"
         name="My prize"
         id="prize"
         max="90">
         </div></td></tr>
<div>
        <tr>
        <td>Enter a Manufacturing date</td>
        <td>
        <input type="date"
         name="dob"
         id="date"
         max="90">
         </div></td></tr>
<div>
    <div>
        <tr>
        <td>Enter a Expired date</td>
        <td>
        <input type="date"
         name="dob"
         id="date"
         max="90">
         </div></td></tr>
<div>
     <tr>
        <td>Enter a phone number</td>
        <td>
        <input type="tel"
         name="phone"
         id="number"
         max="90">
         </div></td></tr>
</div>
<div>
    <tr>
    <td>Enter a Quality</td>
    <td>
     <span>
    <label for="first">First Quality</label>
    <input type="radio"
    name="Quality"
    id="First">
    </span>
    <span>
          <label for="second">Second Quality</label>
    <input type="radio"
    name="Quality"
    id="Second">
     </span>
    <span>
          <label for="third">Third Quality</label>
    <input type="radio"
    name="Quality"
    id="Third">
      </span></td></tr>
      </div>
<div>
    <tr>
    <td>Enter a product image</td>
    <td>
    <input type="file"
    name="file"
    id="file">
    </td>
    </tr>
</div>
<div>
    <tr>
    <td>Enter a comments</td>
    <td>
    <textarea name="Message"
    rows="25" cols="25">comments
    </textarea>
    </td></tr> </table>
</div>
    <td><button type="submit">submit</button></td>
</div>
    </form>
</body>
</html>
